<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarot jóslás – húzz három lapot</title>
<meta name="description" content="Ingyenes tarot jóslás a csillagjegyed alapján. Válaszd ki a jegyed, tedd fel a kérdésed, és húzz három lapot.">
<style>
:root{
  --bg:#17112b; --bg2:#231a44; --gold:#e3c16f; --text:#f1ebff; --muted:#b4a8d6; --card:#2d2257;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg) 60%);color:var(--text);
  font-family:Georgia,"Times New Roman",serif;min-height:100vh;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:clamp(1.7rem,5vw,2.6rem);text-align:center;color:var(--gold);margin:8px 0 6px;letter-spacing:.5px}
.lead{text-align:center;color:var(--muted);max-width:560px;margin:0 auto 24px}
form{background:rgba(255,255,255,.05);border:1px solid rgba(227,193,111,.35);border-radius:16px;padding:20px;
  display:grid;gap:14px;max-width:520px;margin:0 auto}
label{display:grid;gap:6px;font-size:.95rem;color:var(--muted)}
select,input{background:#120d24;color:var(--text);border:1px solid rgba(227,193,111,.4);border-radius:10px;
  padding:12px;font-size:1rem;font-family:inherit}
button.go{background:linear-gradient(135deg,#e3c16f,#b98f33);color:#1b1230;border:0;border-radius:12px;
  padding:14px;font-size:1.05rem;font-weight:bold;cursor:pointer;font-family:inherit}
button.go:hover{filter:brightness(1.08)}
.ad-slot{margin:22px auto;max-width:728px;min-height:90px;border:1px dashed rgba(255,255,255,.15);border-radius:8px;
  display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.25);font-size:.8rem}
#reading{display:none;margin-top:28px}
.hint{text-align:center;color:var(--muted);margin-bottom:14px}
.spread{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 12px}
.spread.n5,.spread.n10{grid-template-columns:repeat(5,1fr)}
.spread.n12{grid-template-columns:repeat(4,1fr)}
.flipall{display:block;margin:0 auto 18px;background:none;border:1px solid var(--gold);color:var(--gold);
  border-radius:20px;padding:8px 18px;font-family:inherit;font-size:.95rem;cursor:pointer}
.flipall:hover{background:rgba(227,193,111,.12)}
.summary{display:none;margin-top:28px;padding:18px 20px;border:1px solid rgba(227,193,111,.35);border-radius:16px;
  background:rgba(255,255,255,.05)}
.summary h2{margin:0 0 8px;color:var(--gold);font-size:1.25rem}
.summary p{margin:0 0 10px}
.summary p:last-child{margin-bottom:0}
.slot{text-align:center}
.pos{color:var(--gold);font-size:.95rem;margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase}
.card{perspective:900px;cursor:pointer;aspect-ratio:300/520;width:100%;border:0;background:none;padding:0}
.inner{position:relative;width:100%;height:100%;transition:transform .8s;transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;overflow:hidden;
  border:2px solid var(--gold);display:flex;align-items:center;justify-content:center}
.back{background:repeating-linear-gradient(45deg,#3a2a78 0 10px,#2d2257 10px 20px);}
.back::after{content:"✦";font-size:2.4rem;color:var(--gold)}
.front{transform:rotateY(180deg);background:var(--card)}
.front img{width:100%;height:100%;object-fit:cover;display:block}
.front.rev img,.front.rev .fallback{transform:rotate(180deg)}
.fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:10px;gap:8px;width:100%;height:100%;color:var(--gold)}
.fallback b{font-size:clamp(.8rem,2.6vw,1.1rem)}
.fallback span{font-size:2rem}
.meaning{margin-top:12px;text-align:left;opacity:0;transition:opacity .6s .5s;font-size:.95rem}
.slot.shown .meaning{opacity:1}
.meaning h3{margin:0 0 4px;color:var(--gold);font-size:1.02rem}
.meaning .tag{display:inline-block;font-size:.72rem;border:1px solid var(--muted);color:var(--muted);
  border-radius:20px;padding:1px 8px;margin-bottom:6px}
.note{color:var(--muted);font-size:.82rem;text-align:center;margin-top:30px}
@media (max-width:760px){.spread.n5,.spread.n10,.spread.n12{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.spread{gap:8px}.meaning{font-size:.85rem}}
</style>
</head>

  <p class="lead">Válaszd ki a csillagjegyed és a kirakást, és húzd ki a lapokat. A lapokat a jegyed és a kérdésed hangolja: ha ma újra kitöltöd ugyanúgy, ugyanazt kapod, holnap új lapok jönnek.</p>

        <option value="11">Halak (febr. 19 – márc. 20)</option>
      </select>
    </label>
    <label>Miről szól a kérdésed?
      <select id="topic">
        <option value="altalanos">Általában az életem</option>
        <option value="szerelem">Szerelem, kapcsolatok</option>
        <option value="munka">Munka, pénz</option>
      </select>
    </label>
    <label>Kirakás
      <select id="spreadType">
        <option value="3">Gyors tanács – 3 lap</option>

        <option value="12">Az elkövetkező 12 hónap – 12 lap</option>
      </select>
    </label>
    <label>A neved (nem kötelező)
      <input id="name" type="text" maxlength="40" autocomplete="given-name">
    </label>
    <button class="go" type="submit">Húzd ki a lapokat</button>
  </form>

  <div class="ad-slot">Hirdetés helye</div>

  <section id="reading" aria-live="polite">
    <p class="hint">Koppints a lapokra, hogy felfordítsd őket.</p>
    <button class="flipall" id="flipall" type="button">Összes lap felfordítása</button>
    <div class="spread" id="spread"></div>
    <div class="summary" id="summary"></div>
  </section>

  <div class="ad-slot">Hirdetés helye</div>
</div>

const MINOR = {

 s:{name:"Kardok",sym:"⚔️",cards:[
  ["Áttörés, tiszta gondolat, igazság.","Zavar, kegyetlen szavak."],
  ["Patthelyzet, halogatott döntés.","Kikényszerített döntés, oldódó feszültség."],

 w:{name:"Botok",sym:"🔥",cards:[

/* ---------- PAKLI ÖSSZEÁLLÍTÁSA ---------- */
const DECK = [];
MAJOR.forEach((m,i)=>DECK.push({
  key:"m"+String(i).padStart(2,"0"), name:m[0], up:m[1], rev:m[2],
  major:true, num:i, suit:null, sym:ROMAN[i]
}));
for(const s of ["c","p","s","w"]){
  MINOR[s].cards.forEach((c,i)=>DECK.push({
    key:s+String(i+1).padStart(2,"0"), name:MINOR[s].name+" "+RANKS[i], up:c[0], rev:c[1],
    major:false, num:i, suit:s, sym:MINOR[s].sym
  }));
}

/* ---------- SEEDELT VÉLETLEN ---------- */
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0}}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function todayStr(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}

/* ---------- SÚLYOZÁS ---------- */
function weightOf(card, sign, topic){
  let w = card.major ? 1.6 : 1;
  if(card.major && card.num===SIGN_CARD[sign]) w *= 5;              // a jegy uralkodó lapja
  if(!card.major && card.suit===SIGN_SUIT[sign]) w *= 2;           // a jegy eleme
  if(!card.major && card.num>=10 && card.suit===SIGN_SUIT[sign]) w *= 1.3; // udvari lapok
  if(topic==="szerelem"){
    if(card.suit==="c") w*=2;
    if(card.major && [3,6,17,19].includes(card.num)) w*=2.2;
  } else if(topic==="munka"){
    if(card.suit==="p") w*=2;
    if(card.suit==="w") w*=1.5;
    if(card.major && [1,7,10,21].includes(card.num)) w*=2.2;
  }
  return w;
}

function draw(sign, topic, name, count){
  const seedStr = [sign, topic, name.trim().toLowerCase(), count, todayStr()].join("|");
  const rnd = mulberry32(xmur3(seedStr)());
  const pool = DECK.map(c=>({c, w:weightOf(c,sign,topic)}));
  const picks = [];
  for(let n=0;n<count;n++){
    const total = pool.reduce((a,b)=>a+b.w,0);
    let r = rnd()*total, idx=0;
    for(;idx<pool.length;idx++){ r-=pool[idx].w; if(r<=0) break; }
    idx = Math.min(idx,pool.length-1);
    const card = pool.splice(idx,1)[0].c;
    picks.push({card, reversed: rnd()<0.3});
  }
  return picks;
}

/* ---------- MEGJELENÍTÉS ---------- */
const MONTHS = ["Január","Február","Március","Április","Május","Június","Július","Augusztus","Szeptember","Október","November","December"];

    ["9. Remények és félelmek","Ez foglalkoztat legbelül:"],
    ["10. Kimenetel","Ide vezethet az út:"]];
  const start = new Date().getMonth();
  return Array.from({length:12},(_,i)=>[MONTHS[(start+i)%12],"Ez a hónap erről szól:"]);
}

function summaryHtml(picks){
  const n = picks.length;
  const majors = picks.filter(p=>p.card.major).length;
  const rev = picks.filter(p=>p.reversed).length;
  const cnt = {c:0,p:0,s:0,w:0};
  picks.forEach(p=>{ if(p.card.suit) cnt[p.card.suit]++; });
  const top = Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  const parts = [];
  if(majors >= Math.ceil(n*0.4)){
    parts.push("Sok nagy arkánum került ki: ez nagy jelentőségű időszakot jelez, amikor a döntéseid hosszú távra szólnak, és nem a véletlen, hanem az életed nagyobb témái dolgoznak.");
  } else if(majors===0){
    parts.push("Nem jött ki nagy arkánum: a helyzet inkább a hétköznapi apró döntésekről és tettekről szól, és a kezedben van az irányítás.");
  } else {
    parts.push("A nagy arkánumok kevesen vannak, vagyis a nagy sorsfordulók helyett a mindennapi döntéseid számítanak most.");
  }
  if(top && top[1] >= Math.ceil(n*0.34)){
    const msg = {
      c:"A Kelyhek dominálnak: az érzelmek, a kapcsolatok és a belső világod van most előtérben.",
      p:"Az Érmék dominálnak: a munka, a pénz és a kézzelfogható biztonság a téma.",
      s:"A Kardok dominálnak: a gondolatok, a döntések és az őszinte beszélgetések kerülnek előtérbe, esetleg némi feszültséggel.",
      w:"A Botok dominálnak: tett, lendület és szenvedély jellemzi ezt az időszakot."
    }[top[0]];
    parts.push(msg);
  }
  if(rev >= Math.ceil(n/2)){
    parts.push("Sok fordított lap van: valami belül elakadt vagy késik, érdemes megnézned, mi tart vissza, mielőtt újabb lépést teszel.");
  } else if(rev===0){
    parts.push("Egyetlen lap sem fordított: az energiák szabadon áramolnak, nincs komoly akadály.");
  }
  parts.push("Olvasd össze a lapokat egy történetként: a legerősebb üzenetet általában az hordozza, amelyik a legjobban rezonál arra, amit most élsz.");
  return "<h2>Összegzés</h2>"+parts.map(t=>"<p>"+t+"</p>").join("");
}
const IMG_DIR = ""; // ide kerülnek a lapok képei: m00.webp ... m21.webp, c01.webp ... w14.webp

function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}

function render(picks){
  const spread = document.getElementById("spread");
  const summary = document.getElementById("summary");
  const POS = spreadPositions(picks.length);
  const POSITIONS = POS.map(x=>x[0]), POS_INTRO = POS.map(x=>x[1]);
  spread.innerHTML = "";
  spread.className = "spread n"+picks.length;
  summary.style.display = "none";
  summary.innerHTML = summaryHtml(picks);
  let flippedCount = 0;
  const flips = [];
  function flip(btn, slot){
    if(btn.classList.contains("flipped")) return;
    btn.classList.add("flipped"); slot.classList.add("shown");
    flippedCount++;
    if(flippedCount===picks.length){
      setTimeout(()=>{summary.style.display="block"},900);
    }
  }
  document.getElementById("flipall").onclick = ()=>{
    flips.forEach((f,i)=>setTimeout(f,i*180));
  };
  picks.forEach((p,i)=>{
    const c = p.card;
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.innerHTML = `
      <div class="pos">${POSITIONS[i]}</div>
      <button class="card" type="button" aria-label="Lap felfordítása: ${POSITIONS[i]}">
        <div class="inner">
          <div class="face back"></div>
          <div class="face front ${p.reversed?"rev":""}">
            <img src="${IMG_DIR}${c.key}.webp" alt="${esc(c.name)}" loading="lazy">
            <div class="fallback" style="display:none"><span>${c.sym}</span><b>${esc(c.name)}</b></div>
          </div>
        </div>
      </button>
      <div class="meaning">
        <h3>${esc(c.name)}</h3>
        <span class="tag">${p.reversed?"fordított állás":"egyenes állás"}</span>
        <div>${POS_INTRO[i]} ${esc(p.reversed?c.rev:c.up)}</div>
      </div>`;
    const img = slot.querySelector("img");
    img.addEventListener("error",()=>{img.style.display="none";slot.querySelector(".fallback").style.display="flex"});
    const btn = slot.querySelector(".card");
    btn.addEventListener("click",()=>flip(btn,slot));
    flips.push(()=>flip(btn,slot));
    spread.appendChild(slot);
  });
  const sec = document.getElementById("reading");
  sec.style.display = "block";
  sec.scrollIntoView({behavior:"smooth",block:"start"});
}

document.getElementById("form").addEventListener("submit",e=>{
  e.preventDefault();
  const sign = parseInt(document.getElementById("sign").value,10);
  if(isNaN(sign)) return;
  const topic = document.getElementById("topic").value;
  const name = document.getElementById("name").value;
  const count = parseInt(document.getElementById("spreadType").value,10);
  render(draw(sign, topic, name, count));
});
</script>
